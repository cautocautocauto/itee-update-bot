name: Controllo aggiornamenti ITEE

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: itee-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Recupera l'ultimo stato delle pagine
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: itee-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            itee-state-

      - name: Controlla il sito e avvisa su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTP_TIMEOUT_SECONDS: "30"
        run: python bot.py

      - name: Salva il nuovo stato delle pagine
        if: success()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: itee-state-${{ github.run_id }}-${{ github.run_attempt }}
